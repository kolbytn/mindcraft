name: Apply skill utilities refactor

on:
  push:
    branches:
      - refactor/skill-utilities

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/skill-utilities

      - name: Extract generic skill utilities
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/agent/library/skills.js')
          text = path.read_text()

          import_anchor = 'import settings from "../../../settings.js";\n'
          utility_import = "import { log, wait } from './skill_utils.js';\nexport { log, wait };\n"
          if utility_import not in text:
              if import_anchor not in text:
                  raise SystemExit('settings import anchor not found')
              text = text.replace(import_anchor, import_anchor + utility_import, 1)

          log_start = text.find('export function log(bot, message) {\n')
          log_end_marker = 'async function autoLight(bot) {\n'
          log_end = text.find(log_end_marker, log_start)
          if log_start == -1 or log_end == -1:
              raise SystemExit('log helper block not found')
          text = text[:log_start] + text[log_end:]

          wait_start = text.find('export async function wait(bot, milliseconds) {\n')
          wait_end_marker = 'export async function smeltItem(bot, itemName, num=1) {\n'
          wait_end = text.find(wait_end_marker, wait_start)
          if wait_start == -1 or wait_end == -1:
              raise SystemExit('wait helper block not found')
          text = text[:wait_start] + text[wait_end:]

          path.write_text(text)

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-skill-utils-refactor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent/library/skills.js
          git commit -m 'refactor: use extracted skill utilities'
          git push origin HEAD:refactor/skill-utilities
