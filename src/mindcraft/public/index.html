<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindcraft Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 flex justify-between items-center px-6 py-4 sticky top-0 z-50">
    <h1 class="text-2xl font-semibold text-white" id="title">Mindcraft Dashboard</h1>

    <div class="flex items-center gap-4">
      <!-- Language Selector -->
      <div class="relative">
        <button id="langDropdownBtn" class="bg-gray-700 text-white px-3 py-1 rounded flex items-center gap-1">
          <span id="currentLang">日本語</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
        <div id="langDropdown" class="hidden absolute right-0 mt-1 bg-gray-800 border border-gray-700 rounded shadow-lg w-32 z-50">
          <button class="block w-full text-left px-4 py-2 hover:bg-gray-700" data-lang="ja">日本語</button>
          <button class="block w-full text-left px-4 py-2 hover:bg-gray-700" data-lang="en">English</button>
          <button class="block w-full text-left px-4 py-2 hover:bg-gray-700" data-lang="es">Español</button>
        </div>
      </div>

      <span id="msStatus" class="px-3 py-1 rounded-full text-sm font-medium bg-red-900 text-red-400">Offline</span>
    </div>
  </header>

  <!-- Main Content -->
  <main id="agents" class="p-6 grid gap-6 md:grid-cols-2 lg:grid-cols-3 flex-1 overflow-y-auto">
    <!-- Agent cards will be injected here -->
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 border-t border-gray-700 px-6 py-4 flex justify-between items-center sticky bottom-0">
    <button id="openCreateAgentBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium transition" data-i18n="newAgent">+ New Agent</button>
    <div class="flex gap-3">
      <button class="bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded-lg transition" onclick="disconnectAllAgents()" data-i18n="disconnectAll">Disconnect All</button>
      <button class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg transition" onclick="confirmShutdown()" data-i18n="shutdown">Full Shutdown</button>
    </div>
  </footer>

  <!-- Create Agent Modal -->
  <div id="createAgentModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-xl w-full max-w-lg shadow-xl overflow-hidden">
      <div class="flex justify-between items-center px-5 py-3 border-b border-gray-700">
        <h2 class="text-lg font-semibold" data-i18n="createAgent">Create Agent</h2>
        <button id="closeCreateAgentBtn" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded">×</button>
      </div>
      <div class="p-5 space-y-4">
        <p id="profileStatus" class="text-sm text-gray-400">Profile: Not uploaded</p>
        <div id="settingsForm" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        <p id="createError" class="text-red-500 text-sm"></p>
        <input type="file" id="profileFileInput" accept=".json" class="hidden">
      </div>
      <div class="px-5 py-3 border-t border-gray-700 flex justify-between items-center">
        <span id="footerStatus" class="text-xs text-gray-400">Upload a profile to continue.</span>
        <div class="flex gap-2">
          <button id="uploadProfileBtn" class="bg-gray-600 hover:bg-gray-500 text-white px-3 py-1 rounded" data-i18n="upload">Upload</button>
          <button id="submitCreateAgentBtn" disabled class="bg-emerald-600 opacity-50 text-white px-3 py-1 rounded" data-i18n="create">Create</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const translations = {
      ja: {
        title: 'マインドクラフト ダッシュボード',
        newAgent: '+ 新しいエージェント',
        disconnectAll: 'すべて切断',
        shutdown: '完全シャットダウン',
        createAgent: 'エージェントを作成',
        upload: 'アップロード',
        create: '作成'
      },
      en: {
        title: 'Mindcraft Dashboard',
        newAgent: '+ New Agent',
        disconnectAll: 'Disconnect All',
        shutdown: 'Full Shutdown',
        createAgent: 'Create Agent',
        upload: 'Upload',
        create: 'Create'
      },
      es: {
        title: 'Panel de Mindcraft',
        newAgent: '+ Nuevo Agente',
        disconnectAll: 'Desconectar Todo',
        shutdown: 'Apagar Todo',
        createAgent: 'Crear Agente',
        upload: 'Subir',
        create: 'Crear'
      }
    };

    let currentLang = 'ja';

    function applyLanguage(lang) {
      const dict = translations[lang] || translations.en;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });
      document.getElementById('title').textContent = dict.title;
      document.getElementById('currentLang').textContent = lang === 'ja' ? '日本語' : lang === 'en' ? 'English' : 'Español';
    }

    const dropdownBtn = document.getElementById('langDropdownBtn');
    const dropdownMenu = document.getElementById('langDropdown');

    dropdownBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('hidden');
    });

    dropdownMenu.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', e => {
        const lang = e.target.dataset.lang;
        currentLang = lang;
        applyLanguage(lang);
        dropdownMenu.classList.add('hidden');
      });
    });

    const socket = io();
    const agentsDiv = document.getElementById('agents');
    const modal = document.getElementById('createAgentModal');

    const msStatus = document.getElementById('msStatus');
    function updateStatus(connected) {
      if (connected) {
        msStatus.textContent = 'Online';
        msStatus.className = 'px-3 py-1 rounded-full text-sm font-medium bg-emerald-900 text-emerald-400';
      } else {
        msStatus.textContent = 'Offline';
        msStatus.className = 'px-3 py-1 rounded-full text-sm font-medium bg-red-900 text-red-400';
      }
    }

    socket.on('connect', () => updateStatus(true));
    socket.on('disconnect', () => updateStatus(false));

    document.getElementById('openCreateAgentBtn').addEventListener('click', () => {
      modal.classList.remove('hidden');
    });

    document.getElementById('closeCreateAgentBtn').addEventListener('click', () => {
      modal.classList.add('hidden');
    });

    function disconnectAllAgents() {
      socket.emit('stop-all-agents');
    }

    function confirmShutdown() {
      if (confirm('Are you sure you want to shut down the server?')) {
        socket.emit('shutdown');
      }
    }

    const exampleAgent = (name) => `
      <div class="bg-gray-800 rounded-xl p-4 shadow-md border border-gray-700 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-xl font-semibold text-white">${name}</h2>
            <span class="text-xs bg-emerald-800 text-emerald-300 px-2 py-0.5 rounded">Online</span>
          </div>
          <p class="text-sm text-gray-400 mb-2">Health: 20/20</p>
          <p class="text-sm text-gray-400 mb-2">Hunger: 18/20</p>
          <p class="text-sm text-gray-400 mb-2">Biome: Plains</p>
        </div>
        <div class="flex flex-wrap gap-2 mt-3">
          <button class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">Stop</button>
          <button class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">Stay</button>
          <button class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm">Restart</button>
          <button class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded text-sm">Remove</button>
        </div>
      </div>`;

    agentsDiv.innerHTML = exampleAgent('Agent A') + exampleAgent('Agent B');

    // 初期言語適用
    applyLanguage(currentLang);
  </script>
</body>
</html>
