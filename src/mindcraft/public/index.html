<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindcraft</title>
    <style>
        .status-dot {
            display: inline;
            background-color: green;
        }
    </style>
</head>
<body>
    <h1>Welcome to Mindcraft!</h1>
    <button id="connectButton">Σύνδεση</button>
    <script>
        function setLanguage(lang) {
            // Change language to an empty string
            if (lang === 'auto') {
                lang = '';
            }
        }

        function updateStatus(status) {
            // Update text for all languages when connection state changes
            const statusText = {
                'connected': {'en': 'Connected', 'gr': 'Σύνδεση', 'fr': 'Connecté'},
                'disconnected': {'en': 'Disconnected', 'gr': 'Εκτός σύνδεσης', 'fr': 'Déconnecté'}
            };
            document.getElementById('status').innerText = statusText[status]['en'];
        }
    </script>
</body>
</html>
